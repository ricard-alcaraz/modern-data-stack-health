name: CI - Full Pipeline Build & Test

on:
  pull_request:
    branches:
      - master
    paths:
      - 'transform/**'
      - 'ingestion/**'
      - '.github/workflows/ci-dbt.yml'
  workflow_dispatch:

jobs:
  pipeline-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ingestion dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ingestion/requirements.txt

      - name: Install dbt dependencies
        run: |
          pip install dbt-duckdb

      - name: Run data ingestion (writes to MotherDuck)
        env:
          TOKEN: ${{ secrets.TOKEN }}
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          LANDING_DIR: data/landing
        run: |
          python -m ingestion.main

      - name: Run dbt build (reads from MotherDuck)
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        working-directory: ./transform
        run: |
          dbt deps
          dbt build --target prod