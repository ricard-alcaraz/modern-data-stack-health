name: CI - Build, Lint & Test

on:
  pull_request:
    branches:
      - master
    paths:
      - 'transform/**'
      - 'ingestion/**'
      - 'tests/fixtures/**'
      - 'tests/load_fixtures.py'
      - '.github/workflows/ci-dbt.yml'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff Linter
        run: ruff check ingestion/ tests/

      - name: Run Ruff Formatter
        run: ruff format --check ingestion/ tests/

  test-ingestion:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest responses requests python-dotenv "duckdb==1.5.5"

      - name: Run Pytest
        run: pytest tests/

  dbt-build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "duckdb==1.5.5" "dbt-core==1.10.23" "dbt-duckdb==1.10.0"
          
      - name: Load test fixtures into local DuckDB
        run: |
          # Run from the root directory so ci_test.duckdb is created in the root
          python tests/load_fixtures.py ci_test.duckdb

      - name: Run dbt build against test data
        run: |
          cd transform
          dbt deps
          dbt build --target ci

      - name: Run Elementary tests
        run: |
          cd transform
          dbt run --select elementary --target ci
          dbt test --target ci
        continue-on-error: true
      