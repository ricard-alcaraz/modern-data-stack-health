name: CI - dbt Build & Test

on:
  pull_request:
    branches:
      - master
    paths:
      - 'transform/**'
      - 'tests/fixtures/**'
      - '.github/workflows/ci-dbt.yml'
  workflow_dispatch:

jobs:
  dbt-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./transform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-duckdb

      - name: Load test fixtures into local DuckDB
        run: |
          python ../tests/load_fixtures.py ci_test.duckdb

      - name: Run dbt build against test data
        run: |
          dbt deps
          dbt build --target ci